name: Studio browser
on:
  push:
    branches:
      - codex/immersive-world-studio
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-browser-preview
  cancel-in-progress: true
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx --yes playwright-core@1.56.1 install --with-deps chromium
      - run: npm run build
      - run: npm run test:studio
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-browser-evidence
          path: test-results
          retention-days: 7
