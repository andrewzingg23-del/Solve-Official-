name: Build
on:
  # Verify this bounded staging integration before any merge.
  push:
    branches:
      - main
      - codex/ai-staging-integration-20261111
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/solve-tests.log"
      - name: Report test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: node scripts/report-test-failures.mjs "$RUNNER_TEMP/solve-tests.log"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Browser checks for staging integration
        if: github.ref == 'refs/heads/codex/ai-staging-integration-20261111'
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:product && npm run test:ai-ui
      - name: Upload browser evidence
        if: always() && github.ref == 'refs/heads/codex/ai-staging-integration-20261111'
        uses: actions/upload-artifact@v4
        with:
          name: staging-ai-browser-evidence
          path: |
            test-results/product/*.png
            test-results/ai-console/*.png
          if-no-files-found: ignore
