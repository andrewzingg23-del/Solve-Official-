name: Build
on:
  # Run the same code-quality gate for proposed changes; avoid the old
  # full unit/kernel suite inside every Vercel preview build.
  pull_request:
    branches:
      - main
      - solve/space-presentation
      - codex/ai-staging-integration-20261111
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches:
      - main
      - solve/space-presentation
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact commit
        uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9b # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit and kernel tests
        id: tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/solve-tests.log"
      - name: Report test failures
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: node scripts/report-test-failures.mjs "$RUNNER_TEMP/solve-tests.log"
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Product browser checks
        if: github.event_name == 'pull_request'
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:product
      - name: AI console browser checks when present
        if: github.event_name == 'pull_request' && hashFiles('scripts/test-ai-console.mjs') != ''
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: npm run test:ai-ui
      - name: Upload browser evidence
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-evidence
          path: |
            test-results/product/*.png
            test-results/ai-console/*.png
          if-no-files-found: ignore
